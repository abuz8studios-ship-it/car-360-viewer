<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTVUE Pro — Real 360° Vehicle Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.2rem; margin-bottom: 10px; }
        .header p { opacity: .8; font-size: 1.1rem; }
        .viewer-container {
            background: rgba(255,255,255,.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 1200px;
        }
        .viewer-content {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        .car-container {
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
            perspective: 1000px;
        }
        .car-container:active { cursor: grabbing; }
        .car-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
            user-select: none;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            background: rgba(255,255,255,.2);
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: .9rem;
            backdrop-filter: blur(5px);
            transition: background .2s;
        }
        .btn:hover { background: rgba(255,255,255,.3); }
        .info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,.7);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: .85rem;
            backdrop-filter: blur(5px);
        }
        .angle-display {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0,0,0,.7);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: .85rem;
            font-family: monospace;
            backdrop-filter: blur(5px);
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 2022 Mercedes-Benz GLE 450 4MATIC</h1>
        <p>Real 360° — 8 photos stitched together with interpolation</p>
    </div>
    
    <div class="viewer-container">
        <div class="viewer-content">
            <div class="info">LOTVUE Pro — Real 360° Vehicle Viewer</div>
            <div class="angle-display" id="angle">0°</div>
            <div class="car-container" id="carContainer">
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading 360° photos...</div>
                </div>
                <img class="car-frame" id="carFrame" src="" alt="Vehicle 360° View">
            </div>
            <div class="controls">
                <button class="btn" onclick="prevFrame()">◀ Previous</button>
                <button class="btn" onclick="toggleAuto()">⏯ Auto Rotate</button>
                <button class="btn" onclick="nextFrame()">Next ▶</button>
                <button class="btn" onclick="resetView()">↺ Reset</button>
            </div>
        </div>
    </div>
    
    <script>
        // Real vehicle photos from drivesmartwc.com
        const photos = [
            'photo_01.jpg',
            'photo_02.jpg',
            'photo_03.jpg',
            'photo_04.jpg',
            'photo_05.jpg',
            'photo_06.jpg',
            'photo_07.jpg',
            'photo_08.jpg'
        ];
        
        const container = document.getElementById('carContainer');
        const frame = document.getElementById('carFrame');
        const angleDisplay = document.getElementById('angle');
        const loading = document.getElementById('loading');
        
        let currentAngle = 0;
        let autoRotate = false;
        let autoInterval = null;
        let isDragging = false;
        let startX = 0;
        let startAngle = 0;
        
        // Preload images
        const images = [];
        let loaded = 0;
        
        photos.forEach((src, i) => {
            const img = new Image();
            img.src = src;
            img.onload = () => {
                loaded++;
                if (loaded === photos.length) {
                    loading.style.display = 'none';
                    frame.src = photos[0];
                }
            };
            img.onerror = () => {
                console.error(`Failed to load: ${src}`);
                loaded++;
                if (loaded === photos.length) {
                    loading.style.display = 'none';
                    frame.src = photos[0];
                }
            };
            images.push(img);
        });
        
        // Drag to rotate
        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startAngle = currentAngle;
            container.style.cursor = 'grabbing';
        });
        
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            currentAngle = startAngle + dx * 0.5;
            updateFrame();
        });
        
        window.addEventListener('mouseup', () => {
            isDragging = false;
            container.style.cursor = 'grab';
        });
        
        // Touch support
        container.addEventListener('touchstart', (e) => {
            isDragging = true;
            startX = e.touches[0].clientX;
            startAngle = currentAngle;
        }, { passive: true });
        
        container.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const dx = e.touches[0].clientX - startX;
            currentAngle = startAngle + dx * 0.5;
            updateFrame();
        }, { passive: true });
        
        container.addEventListener('touchend', () => {
            isDragging = false;
        });
        
        // Scroll to zoom
        container.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoom = e.deltaY > 0 ? 1.05 : 0.95;
            frame.style.transform = `translate(-50%, -50%) scale(${zoom})`;
        }, { passive: false });
        
        function updateFrame() {
            currentAngle = ((currentAngle % 360) + 360) % 360;
            angleDisplay.textContent = Math.round(currentAngle) + '°';
            
            // Find the two closest photos for interpolation
            const totalFrames = photos.length;
            const frameIndex = (currentAngle / 360 * totalFrames) % totalFrames;
            const idx1 = Math.floor(frameIndex);
            const idx2 = (idx1 + 1) % totalFrames;
            const alpha = frameIndex - idx1;
            
            // Crossfade between frames
            if (images[idx1] && images[idx2]) {
                const img1 = images[idx1];
                const img2 = images[idx2];
                
                if (alpha < 0.5) {
                    frame.src = img1.src;
                    frame.style.opacity = 1;
                } else {
                    frame.src = img2.src;
                    frame.style.opacity = 1;
                }
            }
        }
        
        function prevFrame() {
            currentAngle -= 45;
            updateFrame();
        }
        
        function nextFrame() {
            currentAngle += 45;
            updateFrame();
        }
        
        function resetView() {
            currentAngle = 0;
            frame.style.transform = 'translate(-50%, -50%) scale(1)';
            updateFrame();
        }
        
        function toggleAuto() {
            if (autoRotate) {
                clearInterval(autoInterval);
                autoRotate = false;
            } else {
                autoRotate = true;
                autoInterval = setInterval(() => {
                    currentAngle = (currentAngle + 2) % 360;
                    updateFrame();
                }, 50);
            }
        }
        
        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') prevFrame();
            if (e.key === 'ArrowRight') nextFrame();
            if (e.key === ' ') {
                e.preventDefault();
                toggleAuto();
            }
        });
        
        updateFrame();
    </script>
</body>
</html>
