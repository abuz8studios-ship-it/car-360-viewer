<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LotVue360 — Interactive 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0d1117; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  #viewer { position:fixed; inset:0; }
  #hud { position:fixed; top:12px; left:12px; z-index:10; color:#fff; background:rgba(13,17,23,.7);
         backdrop-filter:blur(8px); padding:8px 14px; border-radius:10px; font-size:.85rem; font-weight:600; }
  #hud span { color:#58a6ff; }
  #loader { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
            justify-content:center; background:#0d1117; color:#e6edf3; gap:1rem; transition:opacity .4s; }
  #loader.hidden { opacity:0; pointer-events:none; }
  .bar { width:240px; height:6px; background:#21262d; border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,#2E75B6,#58a6ff); transition:width .2s; }
  #err { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
         color:#e6edf3; text-align:center; padding:2rem; background:#0d1117; }
  .hint { position:fixed; bottom:12px; left:50%; transform:translateX(-50%); z-index:10; color:#8b949e;
          font-size:.78rem; background:rgba(13,17,23,.6); padding:6px 12px; border-radius:20px; }
</style>
</head>
<body>
<div id="hud">LotVue<span>360</span> · Interactive 3D</div>
<div id="loader"><div>Loading 3D scene…</div><div class="bar"><div id="prog"></div></div></div>
<div id="err"><div><h2>3D scene not ready</h2><p id="errmsg" style="color:#8b949e;margin-top:.5rem"></p></div></div>
<div class="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
<div id="viewer"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const params = new URLSearchParams(location.search);
// ?src=<url to .ply/.splat/.ksplat>   OR   ?vin=<VIN> (loads /storage/<VIN>/splat/scene.ply)
let src = params.get('src');
const vin = params.get('vin');
if (!src && vin) src = `/storage/${vin.toUpperCase()}/splat/scene.ply`;
if (!src) src = '/storage/DEMO/splat/scene.ply';

const loader = document.getElementById('loader');
const prog = document.getElementById('prog');
const errBox = document.getElementById('err');

function showError(msg) {
  loader.classList.add('hidden');
  document.getElementById('errmsg').textContent = msg;
  errBox.style.display = 'flex';
}

// Brush-exported .ply is Y-up; antimatter15 .splat is Y-down. Pick the right up-axis.
const isPly = /\.ply(\?|$)/i.test(src);
const camUp = isPly ? [0, 1, 0] : [0, -1, 0];

try {
  const viewer = new GaussianSplats3D.Viewer({
    cameraUp: camUp,
    initialCameraPosition: [-4.5, 2.0, 5.5],
    initialCameraLookAt: [0, 0.5, 0],
    sphericalHarmonicsDegree: 1,
    sharedMemoryForWorkers: false,
    rootElement: document.getElementById('viewer')
  });
  // gentle auto-orbit so the vehicle is immediately alive; user drag overrides it
  if (viewer.controls) {
    viewer.controls.autoRotate = true;
    viewer.controls.autoRotateSpeed = 1.2;
    viewer.controls.enableDamping = true;
  }

  viewer.addSplatScene(src, {
    showLoadingUI: false,
    progressiveLoad: true,
    onProgress: (pct) => { prog.style.width = Math.min(100, pct) + '%'; }
  }).then(() => {
    loader.classList.add('hidden');
    viewer.start();
  }).catch((e) => {
    showError('Could not load the 3D model (' + src + '). ' + (e && e.message ? e.message : e));
  });
} catch (e) {
  showError('3D viewer failed to initialize: ' + (e && e.message ? e.message : e));
}
</script>
</body>
</html>
