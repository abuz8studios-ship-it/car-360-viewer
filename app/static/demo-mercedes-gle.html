<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2022 Mercedes-Benz GLE 450 4MATIC - LOTVUE Pro 360° Viewer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }
        .header p { opacity: 0.8; }
        .viewer-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 1200px;
        }
        .viewer-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn {
            flex: 1; padding: 12px 20px; border: none;
            background: rgba(255,255,255,0.1); color: white;
            border-radius: 10px; cursor: pointer; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.2); }
        .tab-btn.active { background: white; color: #1a1a2e; }
        .viewer-content {
            position: relative; background: #000;
            border-radius: 15px; overflow: hidden;
            aspect-ratio: 16/9;
        }
        .exterior-viewer {
            width: 100%; height: 100%; position: relative;
            cursor: grab;
        }
        .exterior-viewer:active { cursor: grabbing; }
        .frame {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain; user-select: none;
        }
        .controls {
            position: absolute; bottom: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 10px; z-index: 100;
        }
        .control-btn {
            padding: 10px 20px; border: none;
            background: rgba(255,255,255,0.2);
            color: white; border-radius: 20px;
            cursor: pointer; font-size: 0.9rem;
            backdrop-filter: blur(5px);
        }
        .control-btn:hover { background: rgba(255,255,255,0.3); }
        .loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .loading-spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚗 2022 Mercedes-Benz GLE 450 4MATIC</h1>
        <p>Drag to rotate • Scroll to zoom • ,299 • 23,054 miles</p>
    </div>
    
    <div class="viewer-container">
        <div class="viewer-tabs">
            <button class="tab-btn active" data-view="exterior">Exterior 360°</button>
        </div>
        
        <div class="viewer-content">
            <div id="exterior-viewer" class="exterior-viewer" data-lotvue-exterior>
                <div class="loading" id="loading">
                    <div class="loading-spinner"></div>
                    <div>Loading 36° frames...</div>
                </div>
            </div>
            <div class="controls">
                <button class="control-btn" onclick="prevFrame()">◀ Previous</button>
                <button class="control-btn" onclick="toggleAutoRotate()">⏯ Auto Rotate</button>
                <button class="control-btn" onclick="nextFrame()">Next ▶</button>
            </div>
        </div>
    </div>
    
    <script src="lotvue_exterior_3d_viewer.js"></script>
    <script>
        const vehicle = {
            vin: "4JGFB5KB6NA764948",
            year: 2022,
            make: "MERCEDES-BENZ",
            model: "GLE",
            trim: "GLE 450 4MATIC SPORT UTILITY 4D",
            price: 50299,
            mileage: 23054,
            color: "GREEN",
            images: []
        };
        
        // Load 36 exterior images (simulated with same image for demo)
        for (let i = 0; i < 36; i++) {
            vehicle.images.push("https://imagescf.dealercenter.net/600/450/202405-eebd227a11234bb2a807b45b6e3069d6/202601-206fe9a91da3402ea3933cbe482e2e02.jpg");
        }
        
        // Initialize viewer
        const viewer = new LotVueExteriorViewer(
            'exterior-viewer',
            '.frame'
        );
        
        // Load frames after page load
        window.addEventListener('load', () => {
            const container = document.getElementById('exterior-viewer');
            vehicle.images.forEach((src, i) => {
                const img = document.createElement('img');
                img.className = 'frame';
                img.src = src;
                img.style.display = i === 0 ? 'block' : 'none';
                container.appendChild(img);
            });
            
            viewer.loadFrames(document.querySelectorAll('.frame'));
            
            // Hide loading
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 500);
        });
        
        function prevFrame() { viewer.previousFrame(); }
        function nextFrame() { viewer.nextFrame(); }
        function toggleAutoRotate() { viewer.toggleAutoRotate(); }
    </script>
</body>
</html>
