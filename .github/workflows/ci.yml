name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-release-constraints.txt
      - name: Install runtime and test dependencies
        env:
          PIP_CONSTRAINT: requirements-release-constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint Python source
        run: python -m ruff check app tests scripts
      - name: Test
        run: python -m pytest -q
      - name: Check patch whitespace
        run: git diff --check
