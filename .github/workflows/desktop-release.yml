name: Desktop releases

on:
  push:
    branches:
      - "arena/01a0ffa3-car-360-viewer"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lotvue-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify core application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-release-constraints.txt
      - name: Install runtime and test dependencies
        env:
          PIP_CONSTRAINT: requirements-release-constraints.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Lint Python source
        run: python -m ruff check app tests scripts
      - name: Run test suite
        run: python -m pytest -q

  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: macos-15
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-release-constraints.txt
      - name: Install portable desktop dependencies
        env:
          PIP_CONSTRAINT: requirements-release-constraints.txt
        shell: bash
        run: |
          python -m pip install --upgrade pip
          set +e
          python -m pip install -r requirements-desktop.txt 2>&1 | tee .desktop-pip-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 80 .desktop-pip-install.log
            python - .desktop-pip-install.log <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"error:|failed|no matching distribution|could not|resolutionimpossible|rust|"
              r"subprocess-exited-with-error|build failed",
              re.IGNORECASE,
          )
          details = [line.strip() for line in lines if pattern.search(line)]
          details = details[-8:] if details else lines[-12:]
          message = " | ".join(details)[-7000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Desktop dependency install failure::{message}")
          PY
            exit "$status"
          fi
          rm -f .desktop-pip-install.log
      - name: Install Linux x86 assembly optimizer for x264
        if: matrix.platform == 'linux'
        run: |
          if ! command -v nasm >/dev/null 2>&1; then
            if sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends nasm; then
              echo 'Installed NASM for optimized x264 assembly.'
            else
              echo '::warning::NASM install failed; source builder will use its C-only x264 fallback.'
            fi
          fi
      - name: Build pinned Linux FFmpeg and x264 from source
        if: matrix.platform == 'linux'
        shell: bash
        run: python scripts/build_ffmpeg_linux.py --output build/ffmpeg/linux-x64 --jobs 4
      - name: Build self-contained application and installer archive
        env:
          LOTVUE_BUILD_ID: ${{ github.sha }}
          LOTVUE_FFMPEG_ROOT: ${{ matrix.platform == 'linux' && 'build/ffmpeg/linux-x64' || '' }}
        shell: bash
        run: |
          set +e
          python scripts/build_desktop.py --platform ${{ matrix.platform }} --output dist/desktop-release 2>&1 | tee .desktop-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            tail -n 80 .desktop-build.log
            python - .desktop-build.log <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"error:|failed|no matching distribution|could not|module not found|"
              r"traceback|exception|subprocess-exited-with-error",
              re.IGNORECASE,
          )
          details = [line.strip() for line in lines if pattern.search(line)]
          details = details[-8:] if details else lines[-12:]
          message = " | ".join(details)[-7000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Desktop build failure::{message}")
          PY
            exit "$status"
          fi
          rm -f .desktop-build.log
      - name: Verify archive checksum, manifest, and bundled notices
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            archive='dist/desktop-release/LotVue360-windows-x64.zip'
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            archive="dist/desktop-release/LotVue360-macOS-${{ matrix.arch }}.zip"
          else
            archive="dist/desktop-release/LotVue360-linux-${{ matrix.arch }}.zip"
          fi
          python scripts/verify_desktop_artifact.py \
            --archive "$archive" \
            --platform "${{ matrix.platform }}" \
            --architecture "${{ matrix.arch }}" \
            --build-id "$GITHUB_SHA"
      - name: Build one-click Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerPath = (Get-Command 'ISCC.exe' -ErrorAction SilentlyContinue).Source
          if (-not $compilerPath) {
            choco install innosetup --no-progress --yes
            $candidate = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
            if (Test-Path -LiteralPath $candidate) { $compilerPath = $candidate }
          }
          if (-not $compilerPath) { throw 'Inno Setup 6 compiler (ISCC.exe) is unavailable.' }
          & $compilerPath 'LotVue360.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compiler failed with exit code $LASTEXITCODE" }
          $installer = Get-Item -LiteralPath 'dist/desktop-release/LotVue360-OneClick-windows-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$($installer.FullName).sha256",
            "$hash  $($installer.Name)`n",
            [Text.Encoding]::ASCII
          )
      - name: Build one-click macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          package="build/desktop/dist/LotVue360-macOS-${{ matrix.arch }}"
          stage="$RUNNER_TEMP/lotvue-one-click-macos"
          image="dist/desktop-release/LotVue360-OneClick-macOS-${{ matrix.arch }}.dmg"
          mkdir -p "$stage"
          ditto "$package/LotVue360.app" "$stage/LotVue360.app"
          cp "$package/install-lotvue.sh" "$package/Install-LotVue360.command" "$stage/"
          cp "$package/README-INSTALL.txt" "$package/INSTALLATION.md" "$package/THIRD_PARTY_NOTICES.md" "$stage/"
          cp "$package/BUILD-MANIFEST.json" "$package/PYTHON-BUILD-CONSTRAINTS.txt" "$stage/"
          chmod +x "$stage/install-lotvue.sh" "$stage/Install-LotVue360.command"
          hdiutil create -quiet -volname 'LotVue360 Installer' -srcfolder "$stage" -format UDZO -ov "$image"
          hdiutil verify "$image"
          (cd "$(dirname "$image")" && shasum -a 256 "$(basename "$image")") > "$image.sha256"
      - name: Verify one-click Linux installer checksum
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          installer='dist/desktop-release/LotVue360-OneClick-linux-x64.run'
          test -x "$installer"
          (cd "$(dirname "$installer")" && sha256sum -c "$(basename "$installer").sha256")
      - name: Smoke-test Windows one-click installer and frozen runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $phase = 'initializing smoke test'
          $data = Join-Path $env:RUNNER_TEMP 'lotvue-desktop-smoke-data'
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs/LotVue360'
          try {
            $phase = 'checking standalone installer checksum'
            $installer = Get-Item -LiteralPath 'dist/desktop-release/LotVue360-OneClick-windows-x64.exe'
            $expectedHash = ((Get-Content -LiteralPath "$($installer.FullName).sha256" -Raw) -split '\s+')[0]
            $actualHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash
            if ($actualHash -ine $expectedHash) { throw 'Windows one-click installer checksum mismatch.' }

            $phase = 'running per-user one-click installer'
            if (Test-Path -LiteralPath $installRoot) { Remove-Item -LiteralPath $installRoot -Recurse -Force }
            $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$installRoot"
            ) -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Windows installer failed with exit code $($install.ExitCode)" }
            if (-not (Test-Path -LiteralPath $installRoot)) { throw 'One-click installer did not create the per-user app directory.' }

            $phase = 'running frozen application self-test'
            $env:LOTVUE_DATA_DIR = $data
            $exe = Join-Path $installRoot 'LotVue360.exe'
            $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -WorkingDirectory $installRoot -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installed Windows app smoke test failed with exit code $($process.ExitCode)" }
            $smokeLog = Join-Path $data 'desktop_launch.log'
            if (-not (Test-Path -LiteralPath $smokeLog)) { throw 'Windows app self-test did not create its launcher log.' }
            if (-not (Select-String -LiteralPath $smokeLog -Pattern 'packaged self-test passed:' -Quiet)) { throw 'Windows app launcher log did not record a passing self-test.' }

            $phase = 'running one-click uninstaller and checking data retention'
            $uninstaller = Join-Path $installRoot 'unins000.exe'
            $remove = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($remove.ExitCode -ne 0) { throw "Windows uninstaller failed with exit code $($remove.ExitCode)" }
            if (Test-Path -LiteralPath $installRoot) { throw 'Windows app files remain after uninstall.' }
            if (-not (Test-Path -LiteralPath $data)) { throw 'Uninstaller unexpectedly removed per-user data.' }
          } catch {
            $details = @("phase=$phase", $_.Exception.ToString())
            $logPaths = @(
              (Join-Path $data 'desktop_launch.log'),
              (Join-Path $data 'desktop_stdio.log'),
              (Join-Path $env:LOCALAPPDATA 'LotVue360/desktop_launch.log'),
              (Join-Path $env:LOCALAPPDATA 'LotVue360/desktop_stdio.log')
            ) | Select-Object -Unique
            foreach ($logPath in $logPaths) {
              if (Test-Path -LiteralPath $logPath) {
                $details += "--- $logPath (tail) ---"
                try {
                  $details += (Get-Content -LiteralPath $logPath -Tail 50) -join "`n"
                } catch {
                  $details += "Could not read smoke log: $($_.Exception.Message)"
                }
              }
            }
            $message = ($details -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop smoke diagnostic::$message"
            throw
          }
      - name: Smoke-test macOS one-click installer and frozen runtime
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/lotvue-macos-smoke"
          mount="$smoke/mounted-installer"
          home="$smoke/home with spaces"
          data="$smoke/user data/LotVue360"
          image="dist/desktop-release/LotVue360-OneClick-macOS-${{ matrix.arch }}.dmg"
          mkdir -p "$mount" "$home"
          (cd "$(dirname "$image")" && shasum -a 256 -c "$(basename "$image").sha256")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$image" >/dev/null
          detach() { hdiutil detach "$mount" -quiet || true; }
          trap detach EXIT
          HOME="$home" LOTVUE_INSTALLER_NO_PAUSE=1 bash "$mount/Install-LotVue360.command" --no-open
          app="$home/Applications/LotVue360.app"
          test -d "$app"
          HOME="$home" LOTVUE_DATA_DIR="$data" "$app/Contents/MacOS/LotVue360" --self-test
          test -f "$data/desktop_launch.log"
          grep -q 'packaged self-test passed:' "$data/desktop_launch.log"
          rm -rf "$app"
          test ! -e "$app"
      - name: Smoke-test Linux one-click installer and frozen runtime
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/lotvue-linux-smoke"
          home="$smoke/home with spaces"
          data_home="$home/XDG data"
          prefix="$home/local app"
          installer='dist/desktop-release/LotVue360-OneClick-linux-x64.run'
          mkdir -p "$smoke/staging" "$home"
          export HOME="$home" XDG_DATA_HOME="$data_home" TMPDIR="$smoke/staging"
          (cd "$(dirname "$installer")" && sha256sum -c "$(basename "$installer").sha256")
          "$installer" --prefix "$prefix" --no-open

          INSTALL_ROOT="$prefix/LotVue360"
          DATA="$data_home/LotVue360"
          test -x "$INSTALL_ROOT/LotVue360"
          LOTVUE_DATA_DIR="$DATA" "$INSTALL_ROOT/LotVue360" --self-test
          grep -q 'packaged self-test passed:' "$DATA/desktop_launch.log"
          printf 'keep on normal uninstall\n' > "$DATA/uninstall-check.txt"
          HOME="$home" XDG_DATA_HOME="$data_home" \
            "$INSTALL_ROOT/Uninstall-LotVue360.sh" --prefix "$prefix"
          test ! -e "$INSTALL_ROOT"
          test -f "$DATA/uninstall-check.txt"
          test ! -e "$data_home/applications/lotvue360.desktop"

          "$installer" --prefix "$prefix" --no-open
          HOME="$home" XDG_DATA_HOME="$data_home" \
            "$INSTALL_ROOT/Uninstall-LotVue360.sh" --prefix "$prefix" --remove-data --yes
          test ! -e "$INSTALL_ROOT"
          test ! -e "$DATA"
          test -z "$(find "$smoke/staging" -mindepth 1 -maxdepth 1 -print -quit)"
      - name: Upload verified platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: lotvue-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/desktop-release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v5
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: lotvue-desktop-*
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "LotVue360 $GITHUB_REF_NAME" \
            --notes-file .github/RELEASE_NOTES.md
